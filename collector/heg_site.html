<style>
/* Layout: a calm reading surface. One lead story with its picture, flowing rows (picture left, words right),
   horizontal rails per heading, and a jobs board. Pictures come from each story; when a story has none
   (or the page cannot load outside images) a small drawing of its field fills the frame. */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --sunken: #e9eeec; --ink: #13201f; --muted: #5b6a67; --faint: #8a9794;
  --line: #dbe2df; --accent: #0f766e; --accent-ink: #ffffff; --warm: #b45309; --band: #10201e; --band-ink: #e8f1ef;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1312; --surface: #131c1b; --sunken: #182423; --ink: #e5eeec; --muted: #9aaba7; --faint: #6f817d;
  --line: #233230; --accent: #2dd4bf; --accent-ink: #062320; --warm: #f59e0b; --band: #060b0a; --band-ink: #e5eeec; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c1312; --surface: #131c1b; --sunken: #182423; --ink: #e5eeec; --muted: #9aaba7; --faint: #6f817d;
  --line: #233230; --accent: #2dd4bf; --accent-ink: #062320; --warm: #f59e0b; --band: #060b0a; --band-ink: #e5eeec; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; letter-spacing: -0.01em; }
.mono { font-family: var(--mono); font-size: 12px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 22px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { margin: 0; font-size: 24px; font-weight: 750; }
.brand h1 span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 12.5px; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs a { padding: 7px 13px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 14px; }
nav.tabs a:hover { color: var(--ink); background: var(--sunken); }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--surface); }

/* ticker */
.ticker { background: var(--band); color: var(--band-ink); overflow: hidden; }
.ticker .wrap { display: flex; align-items: center; gap: 14px; padding-block: 0; }
.ticker .tag { flex: none; font: 500 11px var(--mono); letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
.ticker .window { overflow: hidden; flex: 1; min-width: 0; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.ticker .track { display: flex; gap: 38px; width: max-content; padding-block: 9px; animation: tick var(--dur, 160s) linear infinite; }
.ticker:hover .track { animation-play-state: paused; }
.ticker a { display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; font-size: 13.5px; }
.ticker a:hover span.t { text-decoration: underline; text-underline-offset: 3px; }
.ticker i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.ticker em { font-style: normal; color: color-mix(in srgb, var(--band-ink) 55%, transparent); font-size: 12px; }
@keyframes tick { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .ticker .track { animation: none; } .ticker .window { overflow-x: auto; } }

main { padding-block: 22px 60px; display: flex; flex-direction: column; gap: 34px; }

/* pictures */
.pic { position: relative; overflow: hidden; border-radius: 10px; background: var(--sunken); aspect-ratio: 16 / 10; max-width: 100%; }
.pic canvas, .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

/* lead + briefing */
.lead { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.lead .story { display: flex; flex-direction: column; gap: 12px; }
.lead .story .pic { aspect-ratio: 16 / 9; border-radius: var(--radius); }
.lead h2 { margin: 0; font-size: clamp(24px, 3.2vw, 34px); line-height: 1.12; font-weight: 700; }
.lead p { margin: 0; color: var(--muted); font-size: 16px; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.meta .cat { font-weight: 600; color: var(--c, var(--accent)); }
.pill { font: 500 11px var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.pill.new { background: var(--accent); color: var(--accent-ink); }
.pill.you { background: color-mix(in srgb, var(--warm) 16%, transparent); color: var(--warm); }
.side { display: flex; flex-direction: column; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { margin: 0; font-size: 17px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.panel .sub { color: var(--muted); font-size: 13px; margin: 0; }
.brief { font-size: 14px; line-height: 1.6; }
.brief p { margin: 0 0 8px; }
.brief ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 999px; cursor: pointer; font-size: 13.5px; font-weight: 500; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .55; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
.chip:hover { border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.chip .n { color: var(--faint); font: 400 11.5px var(--mono); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.glance { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.glance div { display: flex; flex-direction: column; }
.glance b { font: 650 24px var(--display); }
.glance span { color: var(--muted); font-size: 12px; }

/* section headings */
.sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.sec-head h2 { margin: 0; font-size: 22px; font-weight: 650; }
.sec-head .hint { color: var(--muted); font-size: 13px; }
.sec-head a.more { margin-left: auto; color: var(--accent); font-weight: 500; font-size: 13.5px; }

/* rails */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 18px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.tile { display: flex; flex-direction: column; gap: 8px; scroll-snap-align: start; min-width: 0; }
.tile h3 { margin: 0; font: 600 15.5px/1.3 var(--display); }
.tile:hover h3, .row:hover h3, .lead .story:hover h2 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.cat-band { display: flex; flex-direction: column; gap: 26px; }
.cat-band section { padding-top: 18px; border-top: 1px solid var(--line); }
.cat-band .sec-head h2::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 9px; vertical-align: 2px; }

/* list layout (news, papers) */
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 30px; align-items: start; }
.filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); display: flex; flex-direction: column; gap: 18px; }
.filters h4 { margin: 0 0 6px; font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.filters .opt { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; padding: 6px 10px; border-radius: 8px; border: 0; background: none; cursor: pointer; font-size: 14px; color: var(--muted); }
.filters .opt:hover { background: var(--sunken); color: var(--ink); }
.filters .opt[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
.filters .opt i { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; display: inline-block; }
.filters .opt .n { font: 400 11.5px var(--mono); color: var(--faint); }
.search { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 14px; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); font: inherit; padding: 6px 0; }
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 18px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: start; }
.row .pic { aspect-ratio: 16 / 11; }
.row .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.row h3 { margin: 0; font: 600 17.5px/1.28 var(--display); }
.row p { margin: 0; color: var(--muted); font-size: 14px; }
.row .actions { display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 500; }
.explain { background: var(--sunken); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--ink); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 6px; }
.toolbar .search { flex: 1 1 280px; }
.count { color: var(--muted); font-size: 13px; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

/* jobs */
.job { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: start; }
.job .mark { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font: 650 18px var(--display); color: #fff; }
.job h3 { margin: 0; font: 600 17px/1.3 var(--display); }
.job:hover h3 { text-decoration: underline; text-underline-offset: 3px; }
.job .who { color: var(--ink); font-size: 14px; }
.job p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.job .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right; }
.fit { display: flex; gap: 3px; }
.fit i { width: 7px; height: 16px; border-radius: 3px; background: var(--sunken); }
.fit i.on { background: var(--accent); }
.save { border: 0; background: none; cursor: pointer; font-size: 18px; line-height: 1; color: var(--faint); padding: 2px; }
.save[aria-pressed="true"] { color: var(--warm); }
.elsewhere { display: flex; flex-direction: column; gap: 10px; }
.elsewhere .links { display: flex; flex-wrap: wrap; gap: 6px; }
.elsewhere a { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; background: var(--surface); }
.elsewhere a:hover { border-color: var(--accent); color: var(--accent); }


footer { border-top: 1px solid var(--line); padding-block: 22px 40px; color: var(--muted); font-size: 12.5px; display: flex; flex-direction: column; gap: 8px; }
footer details summary { cursor: pointer; }
footer ul { columns: 3 200px; margin: 8px 0 0; padding-left: 18px; }

@media (max-width: 900px) {
  .lead { grid-template-columns: 1fr; }
  .layout { grid-template-columns: 1fr; }
  .filters { position: static; flex-direction: row; flex-wrap: wrap; }
  .filters > div { flex: 1 1 200px; }
}
@media (max-width: 560px) {
  .row { grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }
  .row h3 { font-size: 15.5px; }
  .job { grid-template-columns: 40px minmax(0, 1fr); }
  .job .mark { width: 40px; height: 40px; font-size: 15px; }
  .job .right { grid-column: 2; flex-direction: row; align-items: center; }
  .brand small { display: none; }
  .glance b { font-size: 20px; }
}
/* fields and branches */
.atlas-intro { margin: 8px 0 18px; }
.atlas-intro h2 { margin: 0 0 6px; font-family: "Bricolage Grotesque", Inter, sans-serif; font-size: clamp(24px, 3vw, 34px); }
.atlas-intro p { margin: 0; color: #5b6472; max-width: 70ch; }
.atlas { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-bottom: 28px; }
.field { background: #fff; border: 1px solid #e6e8ec; border-top: 4px solid var(--c); border-radius: 14px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.field header { display: flex; gap: 10px; align-items: flex-start; }
.field header .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); margin-top: 7px; flex: none; }
.field header div { flex: 1; }
.field h3 { margin: 0; font-family: "Bricolage Grotesque", Inter, sans-serif; font-size: 20px; }
.field header p { margin: 2px 0 0; color: #5b6472; font-size: 13.5px; }
.count-btn { border: none; background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); font-weight: 650; border-radius: 999px; padding: 4px 11px; cursor: pointer; font: inherit; font-weight: 650; }
.branches { display: flex; flex-direction: column; gap: 4px; }

.field-top { display: block; border-top: 1px dashed #e1e4ea; padding-top: 10px; color: #1f2733; text-decoration: none; font-size: 14px; line-height: 1.4; }

.field-top:hover { color: var(--c); }
.bchips { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
.bchip { border: 1px solid color-mix(in srgb, var(--c) 35%, white); background: color-mix(in srgb, var(--c) 7%, white); color: #1f2733; border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.bchip span { color: var(--c); font-weight: 600; margin-left: 2px; }
.bchip:hover { background: color-mix(in srgb, var(--c) 15%, white); }
.opt.fam { font-weight: 600; margin-top: 6px; }
.ladder { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin-bottom: 14px; }
.track small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #6b7280; margin: 0 0 5px 2px; }
.rungs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.rungs > i { color: #b6bcc6; font-style: normal; }
.rung { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 1px solid #dde1e7; background: #fff; border-radius: 10px; padding: 6px 11px; cursor: pointer; font: inherit; color: #1f2733; }

.pic .ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding: 14px 16px; background: color-mix(in srgb, var(--pc) 9%, #f7f5f0); border-bottom: 3px solid var(--pc); }

<script id="news-data" type="application/json">/*__NEWS_DATA__*/null</script>
<script id="jobs-data" type="application/json">/*__JOBS_DATA__*/null</script>
<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => (/^https:\/\//i.test(u || "") ? u : "");
const store = {
  get(k, d) { try { const v = localStorage.getItem("heglab." + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("heglab." + k, JSON.stringify(v)); } catch { /* private window */ } },
};
const embedded = (id) => { const t = (document.getElementById(id)?.textContent || "").trim(); if (!t || t.startsWith("/*")) return null; try { return JSON.parse(t); } catch { return null; } };

/* Fields and branches of Earth and planetary science. Every story, paper and job is matched
   against the branch keywords (title, summary and source); one item can sit in several branches. */
const FAMILIES = [
  { id: "solid", label: "Solid Earth", color: "#b45309", blurb: "Rocks, minerals, plates, volcanoes and earthquakes" },
  { id: "surface", label: "Surface & water", color: "#0284c7", blurb: "Landscapes, rivers, groundwater, soils, coasts, ice and hazards" },
  { id: "history", label: "Earth history & life", color: "#be123c", blurb: "Deep time, fossils, past climates and living systems" },
  { id: "planetary", label: "Planetary", color: "#4338ca", blurb: "Mars, the Moon and the rest of the Solar System" },
  { id: "applied", label: "Methods & applied", color: "#7c3aed", blurb: "Geophysics, geochemistry, data, resources and the environment" },
  { id: "climate", label: "Climate & policy", color: "#dc2626", blurb: "A changing climate and the decisions around it" },
];
const THEMES = [
  { id: "petrology", family: "solid", label: "Mineralogy & petrology", rx: /mineral(?!s? resource)|petrolog|igneous|metamorph|granit|basalt|crystal|zircon|magmatic/i },
  { id: "tectonics", family: "solid", label: "Plate tectonics & structure", rx: /tecton|subduct|plate boundar|\brift|\bfaults?\b|orogen|mountain[- ]building|lithosphere|\bmantle\b|\bcrust|geodynamic|supercontinent/i },
  { id: "volcanology", family: "solid", label: "Volcanology", rx: /volcan|eruption|\blava\b|magma|caldera|pyroclast|tephra/i },
  { id: "seismology", family: "solid", label: "Earthquakes & seismology", rx: /earthquake|seism|tsunami|aftershock|^M \d\.\d|magnitude \d/i },
  { id: "geomorphology", family: "surface", label: "Geomorphology & landscapes", rx: /geomorph|landscape|erosion|landform|weathering|sediment transport|\bdunes?\b|\bkarst|river (?:channel|delta)|earth surface/i },
  { id: "hydro", family: "surface", label: "Hydrology & hydrogeology", rx: /groundwater|aquifer|hydrogeolog|hydrolog|streamflow|recharge|watershed|catchment|\brivers?\b|drought|flood/i },
  { id: "soils", family: "surface", label: "Soils & critical zone", rx: /\bsoils?\b|soil moisture|critical zone|vadose|regolith|pedolog|peat/i },
  { id: "engineering", family: "surface", label: "Engineering geology & hazards", rx: /engineering geolog|geotechn|landslide|slope (?:stability|failure)|subsidence|sinkhole|liquefaction|rockfall|debris flow|geohazard|natural hazard|\btunnel/i },
  { id: "oceans", family: "surface", label: "Oceans & coasts", rx: /\bocean|marine|seafloor|sea floor|\bcoast|estuar|sea[- ]level|coral|tidal|shoreline/i },
  { id: "cryosphere", family: "surface", label: "Ice & permafrost", rx: /glacier|ice sheet|ice shelf|permafrost|sea ice|snowpack|antarctic|greenland|\barctic/i },
  { id: "deeptime", family: "history", label: "Historical geology & stratigraphy", rx: /stratigraph|historical geolog|geologic(?:al)? (?:time|record)|precambrian|cambrian|ordovician|devonian|carboniferous|permian|triassic|jurassic|cretaceous|paleogene|eocene|miocene|pleistocene|holocene|archean|proterozoic|mass extinction|deep time|million years ago|billion years/i },
  { id: "paleontology", family: "history", label: "Paleontology & fossils", rx: /fossil|paleontolog|palaeontolog|dinosaur|ammonite|trilobite|pterosaur|paleobiolog|extinct/i },
  { id: "paleoclimate", family: "history", label: "Past climates", rx: /paleoclimat|palaeoclimat|ice core|ice age|glacial (?:period|maximum|cycle)|interglacial|sediment core|climate of the past|palaeo/i },
  { id: "ecology", family: "history", label: "Ecology & ecosystems", rx: /ecolog|ecosystem|biodiversity|\bspecies|habitat|wildlife|forest|wetland|\btrees?\b|\bplants?\b|vegetation/i },
  { id: "biogeochem", family: "history", label: "Biogeochemistry", rx: /biogeochem|carbon cycle|nitrogen|phosph|methane|redox|nutrient|microb/i },
  { id: "mars", family: "planetary", label: "Mars", rx: /\bmars\b|martian|perseverance|curiosity rover|jezero|gale crater/i },
  { id: "moon", family: "planetary", label: "The Moon", rx: /\bthe moon\b|\bmoon's|lunar|artemis/i },
  { id: "planets", family: "planetary", label: "Planets, asteroids & the Solar System", rx: /planetary|planet|asteroid|comet|meteor|solar system|\bvenus\b|jupiter|saturn|europa|enceladus|\btitan\b|icy moon|impact crater|icarus|exoplanet/i },
  { id: "geophysics", family: "applied", label: "Geophysics", rx: /geophysic|resistivit|\bERT\b|induced polari|self[- ]potential|electromagnet|ground[- ]penetrating|\bGPR\b|seismic (?:imaging|survey|reflection|refraction|tomograph)|gravity (?:survey|anomal)|magnetotelluric|geoelectric|tomograph/i },
  { id: "geochem", family: "applied", label: "Geochemistry & dating", rx: /geochem|isotop|geochronolog|radiometric|trace element|chemical geology/i },
  { id: "data", family: "applied", label: "Remote sensing, GIS & AI", rx: /remote sensing|satellite|lidar|\bInSAR\b|\bGIS\b|machine learning|deep learning|neural network|artificial intelligence|\bAI\b|digital twin/i },
  { id: "resources", family: "applied", label: "Resources & energy", rx: /mineral resource|\bmining|\bmines?\b|\bores?\b|critical mineral|lithium|rare earth|geotherm|\boil\b|natural gas|hydrogen|carbon (?:capture|storage)|\bCCS\b/i },
  { id: "environment", family: "applied", label: "Environmental geology & pollution", rx: /contamin|pollut|\bPFAS\b|remediat|heavy metal|\bplume|toxic|microplastic|landfill|leachate|oil spill/i },
  { id: "climatechange", family: "climate", label: "Climate change", rx: /climate|global warming|greenhouse|emission|heat ?wave|carbon dioxide|\bCO2\b|net[- ]zero/i },
  { id: "policy", family: "climate", label: "Water & environmental policy", rx: /\bpolic(?:y|ies)\b|regulat|legislat|\bEPA\b|treaty|\bCOP\d*\b|water (?:management|security|rights|supply)|sustainab/i },
];
const FAM = Object.fromEntries(FAMILIES.map((f) => [f.id, f]));
THEMES.forEach((t) => { t.color = FAM[t.family].color; });
const TH = Object.fromEntries(THEMES.map((t) => [t.id, t]));

let NEWS = { items: [], categories: [], sources: [] }, JOBS = { items: [], sources: [] }, CAT = {};
const S = { q: "", cat: null, theme: null, days: 45, mine: false, jq: "", jlevel: "All", jsector: "All", jskills: new Set(), jsort: "fit", savedOnly: false,
  mineThemes: new Set(store.get("branches", THEMES.map((t) => t.id)).filter((id) => THEMES.some((t) => t.id === id))), saved: new Set(store.get("saved", [])) };
if (!S.mineThemes.size) S.mineThemes = new Set(THEMES.map((t) => t.id));

/* ---------- helpers ---------- */
const hours = (iso) => (Date.now() - new Date(iso).getTime()) / 36e5;
const ago = (iso) => { const h = hours(iso); return h < 1 ? "just now" : h < 24 ? `${Math.round(h)} h ago` : h < 48 ? "yesterday" : h < 24 * 7 ? `${Math.round(h / 24)} days ago` : new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
const isNew = (i, data) => data.updated && i.firstSeen === data.updated && hours(i.date) < 72;
const textOf = (i) => `${i.title} ${i.summary || ""} ${i.employer || ""} ${i.source || ""}`;
const themesOf = (i) => (i._t ||= THEMES.filter((t) => t.rx.test(textOf(i))).map((t) => t.id));
const familiesOf = (i) => [...new Set(themesOf(i).map((t) => TH[t].family))];
/* A filter value is a branch id, or "fam:<family>" for a whole field. */
const inTheme = (i, v) => (v.startsWith("fam:") ? familiesOf(i).includes(v.slice(4)) : themesOf(i).includes(v));
const themeName = (v) => (v.startsWith("fam:") ? FAM[v.slice(4)]?.label : TH[v]?.label) || "";
const myScore = (i) => themesOf(i).filter((t) => S.mineThemes.has(t)).length;
const color = (id) => CAT[id]?.color || "#0f766e";

/* Picture slot: the publisher's picture, or a clean card in the field's colour naming the field and source. */
const pic = (i) => {
  const f = FAM[familiesOf(i)[0]];
  const label = f ? f.label : (CAT[i.category]?.label || (i.kind === "Paper" ? "Research paper" : "News"));
  const c = f ? f.color : color(i.category);
  const branch = themesOf(i).map((t) => TH[t]).find((t) => !f || t.family === f.id);
  return `<div class="pic" style="--pc:${c}"><div class="ph"><span>${esc(label)}</span><b>${esc(branch ? branch.label : i.kind === "Paper" ? "Research paper" : "Science news")}</b></div>${safeUrl(i.image) ? `<img src="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}</div>`;
};
function paint(root) {
  root.querySelectorAll(".pic img").forEach((img) => {
    const drop = () => img.remove();
    if (img.complete && !img.naturalWidth) drop(); else img.addEventListener("error", drop, { once: true });
  });
}

/* ---------- pieces ---------- */
function themeLine(i) {
  const ts = themesOf(i).slice(0, 3);
  return ts.length ? `<div class="tagline">${ts.map((t) => `<span><i class="theme-dot" style="background:${TH[t].color}"></i>${esc(TH[t].label)}</span>`).join("")}</div>` : "";
}
function meta(i, data = NEWS) {
  const c = CAT[i.category];
  return `<div class="meta"><span class="cat" style="--c:${color(i.category)}">${esc(c?.label || "")}</span><span>${esc(i.source)}</span><span>${ago(i.date)}</span>${i.kind === "Paper" ? '<span class="pill">Paper</span>' : ""}${isNew(i, data) ? '<span class="pill new">New</span>' : ""}</div>`;
}
const tile = (i) => `<a class="tile" href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener">${pic(i)}${meta(i)}<h3>${esc(i.title)}</h3></a>`;
const row = (i) => `<article class="row"><a href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener">${pic(i, 336, 230)}</a><div class="body">${meta(i)}<a href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener"><h3>${esc(i.title)}</h3></a>${i.summary ? `<p>${esc(i.summary)}</p>` : ""}${themeLine(i)}</div></article>`;

/* ---------- views ---------- */
function trending() {
  const stop = new Set("the a an of to in on for and with from by at as is are be its it this that new how why what study after over into could may can more than about amid says will has have their they our your who us u.s. year years first one two three ai using reveal reveals revealed data framework global study studies based analysis approach model models modeling modelling impact impacts effect effects change changes research scientists researchers shows show find finds found driven during under across between toward towards through while when where which there these those some most other world people help helps".split(" "));
  const counts = new Map();
  for (const i of NEWS.items.filter((i) => hours(i.date) < 96)) {
    const w = i.title.toLowerCase().replace(/[^a-z0-9\s-]/g, " ").split(/\s+/).filter((x) => x.length > 3 && !stop.has(x));
    new Set([...w, ...w.slice(1).map((x, k) => `${w[k]} ${x}`)]).forEach((t) => counts.set(t, (counts.get(t) || 0) + 1));
  }
  const top = [...counts].filter(([t, n]) => n >= (t.includes(" ") ? 3 : 5)).sort((a, b) => b[1] - a[1] || b[0].length - a[0].length);
  const out = [];
  for (const [t] of top) { if (!out.some((o) => o.includes(t) || t.includes(o))) out.push(t); if (out.length >= 10) break; }
  return out;
}
function radar() {
  const week = NEWS.items.filter((i) => hours(i.date) < 24 * 7);
  return `<div class="radar">${FAMILIES.map((f) => {
    const list = week.filter((i) => familiesOf(i).includes(f.id));
    const top = list.find((i) => i.kind === "News") || list[0];
    return `<button class="rt" data-theme="fam:${f.id}"><i style="background:${f.color}"></i><span><b>${esc(f.label)}</b><small>${top ? esc(top.title) : "Nothing new this week"}</small></span><span class="n">${list.length}</span></button>`;
  }).join("")}</div>`;
}
/* Branches page: every field as a card with its branches */
function viewBranches() {
  const week = NEWS.items.filter((i) => hours(i.date) < 24 * 7);
  return `<section class="atlas-intro"><h2>Explore Earth and planetary science</h2><p>Six fields and ${THEMES.length} branches. Pick a branch to see its news and research papers; numbers count this week's stories and papers.</p></section>
    <div class="atlas">${FAMILIES.map((f) => {
      const branches = THEMES.filter((t) => t.family === f.id);
      const famCount = week.filter((i) => familiesOf(i).includes(f.id)).length;
      const top = week.find((i) => i.kind === "News" && familiesOf(i).includes(f.id) && i.image) || week.find((i) => familiesOf(i).includes(f.id));
      return `<article class="field" style="--c:${f.color}"><header><span class="dot"></span><div><h3>${esc(f.label)}</h3><p>${esc(f.blurb)}</p></div><button class="count-btn" data-theme="fam:${f.id}" data-go="news">${famCount}</button></header>
        <div class="branches">${branches.map((t) => { const n = week.filter((i) => themesOf(i).includes(t.id)).length; return `<button class="branch" data-theme="${t.id}" data-go="news"><span>${esc(t.label)}</span><span class="n">${n}</span></button>`; }).join("")}</div>
        ${top ? `<a class="field-top" href="${esc(safeUrl(top.link))}" target="_blank" rel="noopener"><small>Latest</small>${esc(top.title)}</a>` : ""}</article>`;
    }).join("")}</div>`;
}
function viewToday() {
  const items = NEWS.items;
  const fresh = items.filter((i) => i.kind === "News" && i.summary && hours(i.date) < 72);
  const lead = [...fresh].sort((a, b) => (myScore(b) - myScore(a)) || (!!b.image - !!a.image) || b.date.localeCompare(a.date))[0] || items[0];
  const day = items.filter((i) => hours(i.date) < 24).length;
  const topJobs = [...JOBS.items].sort((a, b) => jobFit(b) - jobFit(a) || b.date.localeCompare(a.date)).slice(0, 5);
  let html = `<section class="lead">`;
  if (lead) html += `<a class="story" href="${esc(safeUrl(lead.link))}" target="_blank" rel="noopener">${pic(lead, 960, 540)}${meta(lead)}<h2>${esc(lead.title)}</h2><p>${esc(lead.summary)}</p>${themeLine(lead)}</a>`;
  html += `<div class="side"><div class="panel"><h3>This week by field</h3><p class="sub">Stories and papers in each field of Earth and planetary science. Pick one to see them all, or <a href="#branches">explore every branch</a>.</p>${radar()}</div>
    <div class="panel"><h3>At a glance</h3><div class="glance"><div><b>${day}</b><span>stories in 24 h</span></div><div><b>${items.filter((i) => i.kind === "Paper" && hours(i.date) < 24 * 7).length}</b><span>papers this week</span></div><div><b>${JOBS.items.filter((j) => hours(j.date) < 24 * 7).length}</b><span>new jobs this week</span></div></div>
    <h3 style="margin-top:6px">Trending</h3><div class="chips">${trending().map((t) => `<button class="chip" data-trend="${esc(t)}">${esc(t)}</button>`).join("") || '<span class="note">Not enough stories yet.</span>'}</div></div></div></section>`;
  html += `<div class="cat-band">`;
  for (const f of FAMILIES) {
    const mine = THEMES.filter((t) => t.family === f.id && S.mineThemes.has(t.id));
    if (!mine.length) continue;
    const inMine = (i) => mine.some((t) => themesOf(i).includes(t.id));
    const pool = items.filter((i) => i !== lead && inMine(i)).slice(0, 30);
    const list = [...pool.filter((i) => safeUrl(i.image)), ...pool.filter((i) => !safeUrl(i.image))].slice(0, 10);
    if (list.length < 2) continue;
    const chips = mine.map((t) => { const n = items.filter((i) => themesOf(i).includes(t.id)).length; return n ? `<button class="bchip" data-theme="${t.id}" data-go="news">${esc(t.label)} <span>${n}</span></button>` : ""; }).join("");
    html += `<section style="--c:${f.color}"><div class="sec-head"><h2>${esc(f.label)}</h2><span class="hint">${esc(f.blurb)}</span><a class="more" href="#news" data-goto-theme="fam:${f.id}">See all</a></div><div class="bchips">${chips}</div><div class="rail">${list.map(tile).join("")}</div></section>`;
  }
  const wider = items.filter((i) => i !== lead && !themesOf(i).length && i.kind === "News").slice(0, 10);
  if (wider.length) html += `<section style="--c:#64748b"><div class="sec-head"><h2>Wider field</h2><span class="hint">Science and environment news outside the branches above</span><a class="more" href="#news">All news</a></div><div class="rail">${wider.map(tile).join("")}</div></section>`;
  html += `</div><p class="note">Showing ${S.mineThemes.size} of ${THEMES.length} branches. <button class="linkbtn" data-edit-themes>Choose your branches</button> · <a href="#branches">Explore all branches</a></p>`;
  if (topJobs.length) html += `<section><div class="sec-head"><h2>Jobs in these fields</h2><span class="hint">${JOBS.items.length} open positions from the AGU, Science and Chronicle job boards</span><a class="more" href="#jobs">All jobs</a></div><div class="list">${topJobs.map(jobRow).join("")}</div></section>`;
  return html;
}
function viewList(kind) {
  const q = S.q.toLowerCase();
  const base = NEWS.items.filter((i) => i.kind === kind && hours(i.date) <= S.days * 24);
  const list = base.filter((i) => (!S.cat || i.tags.includes(S.cat)) && (!S.theme || inTheme(i, S.theme)) && (!S.mine || myScore(i) > 0)
    && (!q || `${i.title} ${i.summary} ${i.source}`.toLowerCase().includes(q)));
  const themeOpts = [["", "All branches", base.length], ...FAMILIES.flatMap((f) => [[`fam:${f.id}`, f.label, base.filter((i) => familiesOf(i).includes(f.id)).length, f.color, true],
    ...THEMES.filter((t) => t.family === f.id).map((t) => [t.id, t.label, base.filter((i) => themesOf(i).includes(t.id)).length, null, false])])].filter((o) => o[0] === "" || o[2]);
  const catOpts = [["", "Every topic", base.length], ...NEWS.categories.map((c) => [c.id, c.label, base.filter((i) => i.tags.includes(c.id)).length, c.color]).filter((x) => x[2])];
  const opt = (attr, cur) => ([v, label, n, c, head]) => `<button class="opt${head ? " fam" : head === false ? " sub" : ""}" data-${attr}="${v}" aria-pressed="${(cur || "") === v}"><span>${c ? `<i style="background:${c}"></i>` : ""}${esc(label)}</span><span class="n">${n}</span></button>`;
  const days = [[3, "Last 3 days"], [7, "This week"], [45, "Everything"]];
  return `<div class="layout"><aside class="filters" aria-label="Filters">
      <div><h4>Field and branch</h4>${themeOpts.map(opt("theme", S.theme)).join("")}</div>
      <div><h4>Topic</h4>${catOpts.map(opt("cat", S.cat)).join("")}</div>
      <div><h4>When</h4>${days.map(([d, l]) => `<button class="opt" data-days="${d}" aria-pressed="${S.days === d}"><span>${l}</span></button>`).join("")}</div>
      <div><h4>Focus</h4><button class="opt" data-mine aria-pressed="${S.mine}"><span>Only my branches</span></button></div>
    </aside>
    <div><div class="toolbar"><label class="search"><input id="q" type="search" placeholder="Search ${kind === "Paper" ? "papers" : "news"}…" value="${esc(S.q)}" aria-label="Search"></label><span class="count">${list.length} ${kind === "Paper" ? "papers" : "stories"}</span>${S.theme ? (() => { const other = kind === "Paper" ? "News" : "Paper"; const n = NEWS.items.filter((i) => i.kind === other && hours(i.date) <= S.days * 24 && inTheme(i, S.theme)).length; return n ? `<a class="other-kind" href="#${other === "Paper" ? "papers" : "news"}">See the ${n} ${other === "Paper" ? "research papers" : "news stories"} in ${esc(themeName(S.theme))} →</a>` : ""; })() : ""}</div>
    <div class="list">${list.slice(0, 120).map(row).join("") || '<p class="empty">Nothing matches. Try another branch or a wider time range.</p>'}</div></div></div>`;
}

/* jobs */
const TRACKS = [
  { label: "Industry & government", levels: ["Internship & student", "Entry level", "Mid-career", "Senior & lead"] },
  { label: "Academic", levels: ["Graduate (MS/PhD)", "Postdoc", "Faculty"] },
];
const SECTORS = ["Academia", "Government", "Industry", "Research institute", "Non-profit", "Other"];
const SKILLS = ["GIS", "Python", "R", "MATLAB", "Programming", "Data science & ML", "Numerical modelling", "Remote sensing", "Field work & mapping", "Geophysics",
  "Lab & geochemistry", "Drilling & logging", "Hydrology & water", "Geotechnical", "CAD & surveying", "Regulatory & permitting", "Teaching", "Project management",
  "Grant & scientific writing", "Licensure (PG/PE)"];
const OLD_TYPE = { "PhD & MS": "Graduate (MS/PhD)", Postdoc: "Postdoc", Faculty: "Faculty" };
const levelOf = (j) => j.level || OLD_TYPE[j.type] || "Mid-career";
const sectorOf = (j) => j.sector || (j.type === "Government" ? "Government" : "Other");
const jobOk = (j, skip) => (skip === "level" || S.jlevel === "All" || levelOf(j) === S.jlevel) && (skip === "sector" || S.jsector === "All" || sectorOf(j) === S.jsector)
  && (skip === "theme" || !S.theme || inTheme(j, S.theme)) && (skip === "skills" || [...S.jskills].every((k) => (j.skills || []).includes(k)));
const jobFit = (j) => themesOf(j).length + myScore(j) + (j.match || 0) / 2;
const initials = (s) => (s || "?").replace(/\b(of|the|and|at|for)\b/gi, "").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
const hue = (s) => { let h = 0; for (const c of s || "") h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function jobRow(j) {
  const fit = Math.min(5, Math.round(jobFit(j)));
  return `<article class="job"><div class="mark" style="background:hsl(${hue(j.employer)} 45% 38%)" aria-hidden="true">${esc(initials(j.employer))}</div>
    <div><a href="${esc(safeUrl(j.link))}" target="_blank" rel="noopener"><h3>${esc(j.title)}</h3></a><div class="who">${esc(j.employer)}${j.location ? ` · ${esc(j.location)}` : ""}</div>
    <div class="meta"><span class="pill">${esc(levelOf(j))}</span><span class="pill soft">${esc(sectorOf(j))}</span>${j.salary ? `<span>${esc(j.salary)}</span>` : ""}<span>Posted ${ago(j.date)}</span><span>${esc(j.board)}</span>${isNew(j, JOBS) ? '<span class="pill new">New</span>' : ""}</div>
    ${j.summary ? `<p>${esc(j.summary)}</p>` : ""}${(j.skills || []).length ? `<div class="skills" aria-label="Skills asked for">${j.skills.map((k) => `<button class="skill" data-jskill="${esc(k)}" aria-pressed="${S.jskills.has(k)}">${esc(k)}</button>`).join("")}</div>` : ""}${themeLine(j)}</div>
    <div class="right"><button class="save" data-save="${esc(j.id)}" aria-pressed="${S.saved.has(j.id)}" aria-label="Save this job">${S.saved.has(j.id) ? "★" : "☆"}</button>
    <div class="fit" title="How many branches it matches">${[1, 2, 3, 4, 5].map((k) => `<i class="${k <= fit ? "on" : ""}"></i>`).join("")}</div></div></article>`;
}
function elsewhere() {
  const q = S.jq || "geologist";
  const e = encodeURIComponent(q);
  const links = [["LinkedIn", `https://www.linkedin.com/jobs/search/?keywords=${e}`], ["Indeed", `https://www.indeed.com/jobs?q=${e}`],
    ["Handshake", `https://app.joinhandshake.com/stu/postings?query=${e}`], ["USAJOBS", `https://www.usajobs.gov/search/results/?k=${e}`],
    ["Google Jobs", `https://www.google.com/search?q=${encodeURIComponent(q + " jobs")}&ibp=htl;jobs`], ["HigherEdJobs", `https://www.higheredjobs.com/search/advanced_action.cfm?Keyword=${e}`]];
  return `<div class="panel elsewhere"><h3>Search “${esc(q)}” on other job sites</h3><p class="sub">LinkedIn, Indeed and Handshake don't allow other sites to collect their listings, so these open the same search there.</p><div class="links">${links.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join("")}</div></div>`;
}
function viewJobs() {
  const q = S.jq.toLowerCase();
  const pool = JOBS.items.filter((j) => (!S.savedOnly || S.saved.has(j.id)) && (!q || `${j.title} ${j.employer} ${j.location} ${j.summary} ${(j.skills || []).join(" ")}`.toLowerCase().includes(q)));
  let list = pool.filter((j) => jobOk(j));
  list = list.sort(S.jsort === "fit" ? (a, b) => jobFit(b) - jobFit(a) || b.date.localeCompare(a.date) : (a, b) => b.date.localeCompare(a.date));
  const count = (skip, test) => pool.filter((j) => jobOk(j, skip) && test(j)).length;
  const ladder = `<div class="ladder" role="group" aria-label="Career level">
      <button class="rung all" data-jlevel="All" aria-pressed="${S.jlevel === "All"}"><b>All levels</b><span>${count("level", () => true)}</span></button>
      ${TRACKS.map((t) => `<div class="track"><small>${esc(t.label)}</small><div class="rungs">${t.levels.map((l) => `<button class="rung" data-jlevel="${esc(l)}" aria-pressed="${S.jlevel === l}"><b>${esc(l)}</b><span>${count("level", (j) => levelOf(j) === l)}</span></button>`).join('<i aria-hidden="true">›</i>')}</div></div>`).join("")}
    </div>`;
  const skillCounts = SKILLS.map((k) => [k, count("skills", (j) => (j.skills || []).includes(k))]).filter(([k, n]) => n || S.jskills.has(k)).sort((a, b) => b[1] - a[1]);
  return `<div class="layout"><aside class="filters" aria-label="Job filters">
      <div><h4>Sector</h4>${["All", ...SECTORS].map((t) => `<button class="opt" data-jsector="${esc(t)}" aria-pressed="${S.jsector === t}"><span>${t === "All" ? "All sectors" : esc(t)}</span><span class="n">${count("sector", (j) => t === "All" || sectorOf(j) === t)}</span></button>`).join("")}</div>
      <div><h4>Field</h4><button class="opt" data-theme="" aria-pressed="${!S.theme}"><span>All fields</span></button>${FAMILIES.map((f) => `<button class="opt" data-theme="fam:${f.id}" aria-pressed="${S.theme === `fam:${f.id}`}"><span><i style="background:${f.color}"></i>${esc(f.label)}</span><span class="n">${count("theme", (j) => familiesOf(j).includes(f.id))}</span></button>`).join("")}</div>
      <div><h4>Skills${S.jskills.size ? ` <button class="clear" data-jskill-clear>Clear</button>` : ""}</h4><div class="skills big">${skillCounts.map(([k, n]) => `<button class="skill" data-jskill="${esc(k)}" aria-pressed="${S.jskills.has(k)}">${esc(k)} <span>${n}</span></button>`).join("")}</div></div>
      <div><h4>Sort</h4><button class="opt" data-jsort="fit" aria-pressed="${S.jsort === "fit"}"><span>Best fit first</span></button><button class="opt" data-jsort="new" aria-pressed="${S.jsort === "new"}"><span>Newest first</span></button></div>
      <div><h4>Saved</h4><button class="opt" data-saved aria-pressed="${S.savedOnly}"><span>Only saved jobs</span><span class="n">${S.saved.size}</span></button></div>
    </aside><div>
    ${ladder}
    <div class="toolbar"><label class="search"><input id="jq" type="search" placeholder="Search jobs: geologist, GIS, postdoc, Colorado…" value="${esc(S.jq)}" aria-label="Search jobs"></label><span class="count">${list.length} jobs</span></div>
    ${elsewhere()}
    <div class="list">${list.slice(0, 150).map(jobRow).join("") || '<p class="empty">No jobs match. Try another level, sector, field or skill.</p>'}</div></div></div>`;
}

/* ---------- choose themes ---------- */
function editThemes() {
  const back = document.createElement("div"); back.className = "modal-back";
  const box = document.createElement("div"); box.className = "panel modal"; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Choose your branches");
  box.innerHTML = `<h3>Your branches</h3><p class="sub">Today shows the fields of the branches you pick, and “Only my branches” filters to them. Saved in this browser only.</p>
    <div class="modal-scroll">${FAMILIES.map((f) => `<h4 style="color:${f.color}">${esc(f.label)}</h4>${THEMES.filter((t) => t.family === f.id).map((t) => `<label><input type="checkbox" value="${t.id}" ${S.mineThemes.has(t.id) ? "checked" : ""}><i class="theme-dot" style="background:${t.color}"></i>${esc(t.label)}</label>`).join("")}`).join("")}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-m="save">Save</button></div>`;
  document.body.append(back, box);
  const close = () => { back.remove(); box.remove(); };
  back.addEventListener("click", close);
  box.addEventListener("click", (e) => {
    const b = e.target.closest("[data-m]"); if (!b) return;
    if (b.dataset.m === "save") { S.mineThemes = new Set([...box.querySelectorAll("input:checked")].map((x) => x.value)); store.set("branches", [...S.mineThemes]); }
    close(); render();
  });
}

/* ---------- render + routing ---------- */
const route = () => (["today", "branches", "news", "papers", "jobs"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "today");
function render() {
  const r = route(), view = $("#view");
  const keep = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.getAttribute("href") === `#${r}` ? "page" : "false"));
  view.innerHTML = !NEWS.items.length && r !== "jobs" ? '<p class="empty">No stories collected yet.</p>' : r === "news" ? viewList("News") : r === "papers" ? viewList("Paper") : r === "jobs" ? viewJobs() : r === "branches" ? viewBranches() : viewToday();
  paint(view);
  if (keep && document.getElementById(keep)) { const el = document.getElementById(keep); el.focus(); if (pos != null && el.setSelectionRange) el.setSelectionRange(pos, pos); }
}
function ticker() {
  const top = NEWS.items.filter((i) => i.kind === "News").slice(0, 26);
  const one = top.map((i) => `<a href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener"><i style="background:${color(i.category)}"></i><span class="t">${esc(i.title)}</span><em>${esc(i.source)}</em></a>`).join("");
  const t = $("#ticker"); t.innerHTML = one + one; t.style.setProperty("--dur", `${Math.max(80, top.length * 8)}s`);
}
function footer() {
  const ok = (NEWS.sources || []).filter((s) => s.ok).length;
  $("#foot").innerHTML = `<div>An informal, automatically updated digest of news, research papers and jobs from public feeds and job boards. Summaries are the publishers' own. Not affiliated with any university.</div>`
    + `<div>Updated ${NEWS.updated ? new Date(NEWS.updated).toLocaleString(undefined, { weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit" }) : "—"} from ${ok} public news feeds and ${(JOBS.sources || []).filter((s) => s.ok).length} job boards, twice a day. Summaries are the opening lines of each source's own article; follow the link for the full story. Pictures belong to their publishers; where a story has none, a card shows its field and source.</div>`
    + `<details><summary>Sources</summary><ul>${[...(NEWS.sources || []), ...(JOBS.sources || [])].map((s) => `<li>${esc(s.source)} ${s.ok ? `· ${s.count}` : "· unavailable"}</li>`).join("")}</ul></details>`;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a"); if (!t) return;
  const d = t.dataset;
  if (d.cat !== undefined && t.classList.contains("opt")) { S.cat = d.cat || null; render(); }
  else if (d.theme !== undefined) { S.theme = d.theme || null; S.cat = null; if (t.classList.contains("rt") || d.go) location.hash = `#${d.go || "news"}`; else render(); if (location.hash === `#${d.go || "news"}`) render(); }
  else if (d.days) { S.days = +d.days; render(); }
  else if (d.mine !== undefined) { S.mine = !S.mine; render(); }
  else if (d.trend) { S.q = d.trend; S.theme = null; location.hash = "#news"; }
  else if (d.gotoTheme) { S.theme = d.gotoTheme; S.cat = null; }
  else if (d.editThemes !== undefined) editThemes();
  else if (d.jlevel) { S.jlevel = d.jlevel; render(); }
  else if (d.jsector) { S.jsector = d.jsector; render(); }
  else if (d.jskill) { S.jskills.has(d.jskill) ? S.jskills.delete(d.jskill) : S.jskills.add(d.jskill); render(); }
  else if (d.jskillClear !== undefined) { S.jskills.clear(); render(); }
  else if (d.jsort) { S.jsort = d.jsort; render(); }
  else if (d.saved !== undefined) { S.savedOnly = !S.savedOnly; render(); }
  else if (d.save) { S.saved.has(d.save) ? S.saved.delete(d.save) : S.saved.add(d.save); store.set("saved", [...S.saved]); render(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.q = e.target.value; clearTimeout(S.t); S.t = setTimeout(render, 160); }
  if (e.target.id === "jq") { S.jq = e.target.value; clearTimeout(S.t); S.t = setTimeout(render, 160); }
});
window.addEventListener("hashchange", () => { render(); window.scrollTo({ top: 0 }); });

async function boot() {
  NEWS = embedded("news-data") || await fetch("news.json").then((r) => r.json()).catch(() => NEWS);
  JOBS = embedded("jobs-data") || await fetch("jobs.json").then((r) => r.json()).catch(() => JOBS);
  CAT = Object.fromEntries((NEWS.categories || []).map((c) => [c.id, c]));
  ticker(); footer(); render();
}
boot();
})();
</script>
