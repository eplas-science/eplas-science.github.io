(() => {

/* Fields and branches of Earth and planetary science. Every story, paper and job is matched

const FAMILIES = [
  { id: "solid", label: "Solid Earth", color: "#b45309", blurb: "Rocks, minerals, plates, volcanoes and earthquakes" },

];
const THEMES = [
  { id: "petrology", family: "solid", label: "Mineralogy & petrology", rx: /mineral(?!s? resource)|petrolog|igneous|metamorph|granit|basalt|crystal|zircon|magmatic/i },
  { id: "tectonics", family: "solid", label: "Plate tectonics & structure", rx: /tecton|subduct|plate boundar|\brift|\bfaults?\b|orogen|mountain[- ]building|lithosphere|\bmantle\b|\bcrust|geodynamic|supercontinent/i },
  { id: "volcanology", family: "solid", label: "Volcanology", rx: /volcan|eruption|\blava\b|magma|caldera|pyroclast|tephra/i },
  { id: "seismology", family: "solid", label: "Earthquakes & seismology", rx: /earthquake|seism|tsunami|aftershock|^M \d\.\d|magnitude \d/i },
  { id: "geomorphology", family: "surface", label: "Geomorphology & landscapes", rx: /geomorph|landscape|erosion|landform|weathering|sediment transport|\bdunes?\b|\bkarst|river (?:channel|delta)|earth surface/i },
  { id: "hydro", family: "surface", label: "Hydrology & hydrogeology", rx: /groundwater|aquifer|hydrogeolog|hydrolog|streamflow|recharge|watershed|catchment|\brivers?\b|drought|flood/i },

  { id: "engineering", family: "surface", label: "Engineering geology & hazards", rx: /engineering geolog|geotechn|landslide|slope (?:stability|failure)|subsidence|sinkhole|liquefaction|rockfall|debris flow|geohazard|natural hazard|\btunnel/i },
  { id: "oceans", family: "surface", label: "Oceans & coasts", rx: /\bocean|marine|seafloor|sea floor|\bcoast|estuar|sea[- ]level|coral|tidal|shoreline/i },
  { id: "cryosphere", family: "surface", label: "Ice & permafrost", rx: /glacier|ice sheet|ice shelf|permafrost|sea ice|snowpack|antarctic|greenland|\barctic/i },
  { id: "deeptime", family: "history", label: "Historical geology & stratigraphy", rx: /stratigraph|historical geolog|geologic(?:al)? (?:time|record)|precambrian|cambrian|ordovician|devonian|carboniferous|permian|triassic|jurassic|cretaceous|paleogene|eocene|miocene|pleistocene|holocene|archean|proterozoic|mass extinction|deep time|million years ago|billion years/i },
  { id: "paleontology", family: "history", label: "Paleontology & fossils", rx: /fossil|paleontolog|palaeontolog|dinosaur|ammonite|trilobite|pterosaur|paleobiolog|extinct/i },
  { id: "paleoclimate", family: "history", label: "Past climates", rx: /paleoclimat|palaeoclimat|ice core|ice age|glacial (?:period|maximum|cycle)|interglacial|sediment core|climate of the past|palaeo/i },
  { id: "ecology", family: "history", label: "Ecology & ecosystems", rx: /ecolog|ecosystem|biodiversity|\bspecies|habitat|wildlife|forest|wetland|\btrees?\b|\bplants?\b|vegetation/i },
  { id: "biogeochem", family: "history", label: "Biogeochemistry", rx: /biogeochem|carbon cycle|nitrogen|phosph|methane|redox|nutrient|microb/i },
  { id: "mars", family: "planetary", label: "Mars", rx: /\bmars\b|martian|perseverance|curiosity rover|jezero|gale crater/i },
  { id: "moon", family: "planetary", label: "The Moon", rx: /\bthe moon\b|\bmoon's|lunar|artemis/i },
  { id: "planets", family: "planetary", label: "Planets, asteroids & the Solar System", rx: /planetary|planet|asteroid|comet|meteor|solar system|\bvenus\b|jupiter|saturn|europa|enceladus|\btitan\b|icy moon|impact crater|icarus|exoplanet/i },
  { id: "geophysics", family: "applied", label: "Geophysics", rx: /geophysic|resistivit|\bERT\b|induced polari|self[- ]potential|electromagnet|ground[- ]penetrating|\bGPR\b|seismic (?:imaging|survey|reflection|refraction|tomograph)|gravity (?:survey|anomal)|magnetotelluric|geoelectric|tomograph/i },
  { id: "geochem", family: "applied", label: "Geochemistry & dating", rx: /geochem|isotop|geochronolog|radiometric|trace element|chemical geology/i },
  { id: "data", family: "applied", label: "Remote sensing, GIS & AI", rx: /remote sensing|satellite|lidar|\bInSAR\b|\bGIS\b|machine learning|deep learning|neural network|artificial intelligence|\bAI\b|digital twin/i },
  { id: "resources", family: "applied", label: "Resources & energy", rx: /mineral resource|\bmining|\bmines?\b|\bores?\b|critical mineral|lithium|rare earth|geotherm|\boil\b|natural gas|hydrogen|carbon (?:capture|storage)|\bCCS\b/i },
  { id: "environment", family: "applied", label: "Environmental geology & pollution", rx: /contamin|pollut|\bPFAS\b|remediat|heavy metal|\bplume|toxic|microplastic|landfill|leachate|oil spill/i },
  { id: "climatechange", family: "climate", label: "Climate change", rx: /climate|global warming|greenhouse|emission|heat ?wave|carbon dioxide|\bCO2\b|net[- ]zero/i },
  { id: "policy", family: "climate", label: "Water & environmental policy", rx: /\bpolic(?:y|ies)\b|regulat|legislat|\bEPA\b|treaty|\bCOP\d*\b|water (?:management|security|rights|supply)|sustainab/i },
];
const FAM = Object.fromEntries(FAMILIES.map((f) => [f.id, f]));
THEMES.forEach((t) => { t.color = FAM[t.family].color; });
const TH = Object.fromEntries(THEMES.map((t) => [t.id, t]));

let NEWS = { items: [], categories: [], sources: [] }, JOBS = { items: [], sources: [] }, MEET = { items: [], tba: [] }, COMM = { items: [], categories: [] }, FUND = { items: [] }, CAT = {};
const S = { q: "", cat: null, theme: null, days: 45, mine: false, fq: "", ftype: "All", fstage: "All", fagency: "All", fsort: "deadline", cfield: null, mfield: null, mregion: "All", jq: "", jlevel: "All", jsector: "All", jskills: new Set(), jsort: "fit", savedOnly: false,
  mineThemes: new Set(store.get("branches", THEMES.map((t) => t.id)).filter((id) => THEMES.some((t) => t.id === id))), saved: new Set(store.get("saved", [])) };
if (!S.mineThemes.size) S.mineThemes = new Set(THEMES.map((t) => t.id));

/* ---------- helpers ---------- */
const hours = (iso) => (Date.now() - new Date(iso).getTime()) / 36e5;
const ago = (iso) => { const h = hours(iso); return h < 1 ? "just now" : h < 24 ? `${Math.round(h)} h ago` : h < 48 ? "yesterday" : h < 24 * 7 ? `${Math.round(h / 24)} days ago` : new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
const isNew = (i, data) => data.updated && i.firstSeen === data.updated && hours(i.date) < 72;
const textOf = (i) => `${i.title} ${i.summary || ""} ${i.employer || ""} ${i.source || ""}`;
const themesOf = (i) => (i._t ||= THEMES.filter((t) => t.rx.test(textOf(i))).map((t) => t.id));
const familiesOf = (i) => [...new Set(themesOf(i).map((t) => TH[t].family))];
/* A filter value is a branch id, or "fam:<family>" for a whole field. */
const inTheme = (i, v) => (v.startsWith("fam:") ? familiesOf(i).includes(v.slice(4)) : themesOf(i).includes(v));
const themeName = (v) => (v.startsWith("fam:") ? FAM[v.slice(4)]?.label : TH[v]?.label) || "";
const myScore = (i) => themesOf(i).filter((t) => S.mineThemes.has(t)).length;
const color = (id) => CAT[id]?.color || "#0f766e";

/* Fine line icons (24 x 24, drawn with the text colour). */
const ICONS = {
  pin: '<path d="M12 21s-6-5.3-6-10a6 6 0 1 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>',
  bookmark: '<path d="M6.5 4h11a1 1 0 0 1 1 1v15l-6.5-4-6.5 4V5a1 1 0 0 1 1-1z"/>',
  users: '<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.6-3.2 3-5 6-5s5.4 1.8 6 5M15.5 5.6a3 3 0 0 1 0 5.8M17.5 14.8c1.9.6 3.2 2.2 3.5 4.7"/>',
  help: '<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2.1-2.4 3.6"/><circle cx="12" cy="17" r=".7" fill="currentColor" stroke="none"/>',
  spark: '<path d="M12 3.5l2.2 5.3 5.3 2.2-5.3 2.2-2.2 5.3-2.2-5.3L4.5 11l5.3-2.2z"/>',
  chat: '<path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5h-9l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 5 5.5z"/>',
  bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/>',
  poll: '<path d="M5 20v-9M12 20V5M19 20v-6M3.5 20h17"/>',
  mega: '<path d="M4 10v4h3l7 4V6L7 10zM17.5 9.5a3.5 3.5 0 0 1 0 5"/>',
  briefcase: '<rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5M3.5 12.5h17"/>',
  solid: '<path d="M2.5 19.5l6.5-11 4 6.5 2.5-3.5 6 8z"/><path d="M7.4 11.2l1.6 1.3 1.5-1.2"/>',
  surface: '<path d="M12 3.5c2.5 3 4 5.2 4 7a4 4 0 0 1-8 0c0-1.8 1.5-4 4-7z"/><path d="M3 18.5c1.5 0 1.5 1 3 1s1.5-1 3-1 1.5 1 3 1 1.5-1 3-1 1.5 1 3 1 1.5-1 3-1"/>',
  history: '<path d="M11 12a1 1 0 0 1 2 0a2 2 0 0 1-4 0a3 3 0 0 1 6 0a4.5 4.5 0 0 1-9 0a6 6 0 0 1 12 0"/>',
  planetary: '<circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10" ry="3" transform="rotate(-22 12 12)"/>',
  applied: '<path d="M3 12h3.5L9 6l4 12 2.5-6H21"/>',
  climate: '<path d="M10 14.5V5a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 9v7"/>',
  coin: '<circle cx="12" cy="12" r="8.5"/><path d="M14.6 9.3c-.5-.8-1.4-1.3-2.6-1.3-1.5 0-2.5.8-2.5 1.9 0 2.6 5.1 1.4 5.1 4.2 0 1.1-1.1 1.9-2.6 1.9-1.2 0-2.2-.5-2.7-1.4M12 6.5V8M12 16v1.5"/>',
  award: '<circle cx="12" cy="9" r="5.5"/><path d="M8.8 13.5L7.5 21l4.5-2.5 4.5 2.5-1.3-7.5"/>',
};
const ic = (name, size = 18) => `<svg class="ic" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.spark}</svg>`;

/* Picture slot: the publisher's picture, or a clean card in the field's colour naming the field and source. */
const pic = (i) => {
  const f = FAM[familiesOf(i)[0]];
  const label = f ? f.label : (CAT[i.category]?.label || (i.kind === "Paper" ? "Research paper" : "News"));
  const c = f ? f.color : color(i.category);
  const branch = themesOf(i).map((t) => TH[t]).find((t) => !f || t.family === f.id);
  return `<div class="pic" style="--pc:${c}"><div class="ph"><i class="ico">${ic(f ? f.id : "spark", 20)}</i><span>${esc(label)}</span><b>${esc(branch ? branch.label : i.kind === "Paper" ? "Research paper" : "Science news")}</b></div>${safeUrl(i.image) ? `<img src="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}</div>`;
};
function paint(root) {
  root.querySelectorAll(".pic img").forEach((img) => {
    const drop = () => img.remove();
    if (img.complete && !img.naturalWidth) drop(); else img.addEventListener("error", drop, { once: true });

}

/* ---------- pieces ---------- */
function themeLine(i) {
  const ts = themesOf(i).slice(0, 3);
  return ts.length ? `<div class="tagline">${ts.map((t) => `<span><i class="theme-dot" style="background:${TH[t].color}"></i>${esc(TH[t].label)}</span>`).join("")}</div>` : "";
}
function meta(i, data = NEWS) {
  const c = CAT[i.category];
  return `<div class="meta"><span class="cat" style="--c:${color(i.category)}">${esc(c?.label || "")}</span><span>${esc(i.source)}</span><span>${ago(i.date)}</span>${i.kind === "Paper" ? '<span class="pill">Paper</span>' : ""}${isNew(i, data) ? '<span class="pill new">New</span>' : ""}</div>`;
}
const tile = (i) => `<a class="tile" href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener">${pic(i)}${meta(i)}<h3>${esc(i.title)}</h3></a>`;
const row = (i) => `<article class="row"><a href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener">${pic(i, 336, 230)}</a><div class="body">${meta(i)}<a href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener"><h3>${esc(i.title)}</h3></a>${i.summary ? `<p>${esc(i.summary)}</p>` : ""}${themeLine(i)}</div></article>`;

/* ---------- views ---------- */
function trending() {
  const stop = new Set("the a an of to in on for and with from by at as is are be its it this that new how why what study after over into could may can more than about amid says will has have their they our your who us u.s. year years first one two three ai using reveal reveals revealed data framework global study studies based analysis approach model models modeling modelling impact impacts effect effects change changes research scientists researchers shows show find finds found driven during under across between toward towards through while when where which there these those some most other world people help helps".split(" "));
  const counts = new Map();
  for (const i of NEWS.items.filter((i) => hours(i.date) < 96)) {
    const w = i.title.toLowerCase().replace(/[^a-z0-9\s-]/g, " ").split(/\s+/).filter((x) => x.length > 3 && !stop.has(x));
    new Set([...w, ...w.slice(1).map((x, k) => `${w[k]} ${x}`)]).forEach((t) => counts.set(t, (counts.get(t) || 0) + 1));
  }
  const top = [...counts].filter(([t, n]) => n >= (t.includes(" ") ? 3 : 5)).sort((a, b) => b[1] - a[1] || b[0].length - a[0].length);
  const out = [];
  for (const [t] of top) { if (!out.some((o) => o.includes(t) || t.includes(o))) out.push(t); if (out.length >= 10) break; }
  return out;
}
function radar() {
  const week = NEWS.items.filter((i) => hours(i.date) < 24 * 7);
  return `<div class="radar">${FAMILIES.map((f) => {
    const list = week.filter((i) => familiesOf(i).includes(f.id));
    const top = list.find((i) => i.kind === "News") || list[0];
    return `<button class="rt" data-theme="fam:${f.id}"><i style="background:${f.color}"></i><span><b>${esc(f.label)}</b><small>${top ? esc(top.title) : "Nothing new this week"}</small></span><span class="n">${list.length}</span></button>`;
  }).join("")}</div>`;
}
/* Branches page: every field as a card with its branches */
function viewBranches() {
  const week = NEWS.items.filter((i) => hours(i.date) < 24 * 7);
  return `<section class="atlas-intro"><h2>Explore Earth and planetary science</h2><p>Six fields and ${THEMES.length} branches. Pick a branch to see its news and research papers; numbers count this week's stories and papers.</p></section>
    <div class="atlas">${FAMILIES.map((f) => {

/* ---------- conferences ---------- */
const REGIONS = ["North America", "Europe", "Asia & Oceania"];
const DAY = 864e5;
const utc = (iso) => new Date(`${iso}T00:00:00Z`);
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const fmt = (iso, o) => utc(iso).toLocaleDateString(undefined, { timeZone: "UTC", ...o });

function dateSpan(m) {
  const d = (iso) => fmt(iso, { day: "numeric" }), mo = (iso) => fmt(iso, { month: "short" });
  return m.start.slice(0, 7) === m.end.slice(0, 7) ? `${d(m.start)}–${d(m.end)} ${mo(m.start)}` : `${d(m.start)} ${mo(m.start)} – ${d(m.end)} ${mo(m.end)}`;
}
function when(m) {

  const days = Math.round((utc(m.start) - utc(t)) / DAY);
  return `<span class="soon">${days === 1 ? "tomorrow" : days < 60 ? `in ${days} days` : `in ${Math.round(days / 30.4)} months`}</span>`;
}
function logo(m, size = "") {

  return `<span class="logo ${size}">${m.logo ? `<img src="logos/${esc(m.logo)}.png" alt="" loading="lazy" onerror="this.remove()">` : ""}<em>${fallback}</em></span>`;
}
const yr = (m) => fmt(m.start, { year: "numeric" });
function meetMini(m) {
  return `<a class="meet-mini" href="#conferences">${logo(m, "sm")}<span class="mm"><b>${esc(m.short)}</b><small>${esc(dateSpan(m))} ${yr(m)} · ${esc(m.city)}</small></span>${when(m)}</a>`;

const stamp = (iso) => iso.replaceAll("-", "");
const nextDay = (iso) => new Date(utc(iso).getTime() + DAY).toISOString().slice(0, 10);
const where = (m) => [m.venue, m.city, m.country].filter(Boolean).join(", ");
function gcal(m) {
  const q = new URLSearchParams({ action: "TEMPLATE", text: m.name, dates: `${stamp(m.start)}/${stamp(nextDay(m.end))}`, location: where(m), details: `${m.org}\n${m.url}` });

}
function ics(list) {
  const x = (t) => String(t).replace(/[\\;,]/g, (c) => `\\${c}`).replace(/\n/g, "\\n");
  const now = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const ev = list.map((m) => ["BEGIN:VEVENT", `UID:${m.id}@eplas-science.github.io`, `DTSTAMP:${now}`, `DTSTART;VALUE=DATE:${stamp(m.start)}`, `DTEND;VALUE=DATE:${stamp(nextDay(m.end))}`,
    `SUMMARY:${x(m.name)}`, `LOCATION:${x(where(m))}`, `DESCRIPTION:${x(`${m.org}\n${m.url}`)}`, `URL:${m.url}`, "END:VEVENT"].join("\r\n"));
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//EPLAS//Conferences//EN", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n");
}

  const tba = (MEET.tba || []).filter((t) => !S.mfield || t.fields.includes(S.mfield));
  return `<div class="layout"><aside class="filters" aria-label="Conference filters">
      <div><h4>Field</h4><button class="opt" data-mfield="" aria-pressed="${!S.mfield}"><span>All fields</span><span class="n">${all.filter((m) => meetOk(m, "field")).length}</span></button>${FAMILIES.map((f) => `<button class="opt" data-mfield="${f.id}" aria-pressed="${S.mfield === f.id}"><span><i style="background:${f.color}"></i>${esc(f.label)}</span><span class="n">${all.filter((m) => meetOk(m, "field") && m.fields.includes(f.id)).length}</span></button>`).join("")}</div>
      <div><h4>Region</h4>${["All", ...REGIONS].map((r) => `<button class="opt" data-mregion="${esc(r)}" aria-pressed="${S.mregion === r}"><span>${r === "All" ? "Everywhere" : esc(r)}</span><span class="n">${all.filter((m) => meetOk(m, "region") && (r === "All" || m.region === r)).length}</span></button>`).join("")}</div>
      <div><h4>Calendar</h4><button class="opt" data-ics-all><span>Add all ${list.length} to my calendar</span></button></div>
      ${confNews ? `<div><h4>News</h4><button class="opt" data-news-cat="conferences"><span>Calls for abstracts & meeting news</span><span class="n">${confNews}</span></button></div>` : ""}
    </aside><div>
    ${next ? nextUp(next) : ""}
    ${months.map(([k, ms]) => `<section class="month"><h3>${esc(fmt(`${k}-01`, { month: "long", year: "numeric" }))}</h3>${ms.map(meetCard).join("")}</section>`).join("") || '<p class="empty">No upcoming meetings match. Try another field or region.</p>'}
    ${tba.length ? `<section class="month"><h3>Dates not announced yet</h3><div class="tba">${tba.map((t) => `<a href="${esc(safeUrl(t.url))}" target="_blank" rel="noopener">${logo({ ...t, short: t.name.split(" ")[0] }, "sm")}<span class="mm"><b>${esc(t.name)}</b><small>${esc(t.org)} · ${esc(t.when)}</small></span></a>`).join("")}</div></section>` : ""}
    <p class="note">Dates checked ${MEET.checked ? esc(fmt(MEET.checked, { day: "numeric", month: "long", year: "numeric" })) : ""} against the organisers' pages. Always confirm on the meeting website before booking travel.</p>
    </div></div>`;
}

/* ---------- funding ---------- */
const AGENCIES = [[/^NSF/, "NSF", "nsf"], [/^NASA/, "NASA", "nasa"], [/NOAA/, "NOAA", ""], [/USGS/, "USGS", "usgs"], [/^DOE|^PAMS/, "DOE", "doe"],
  [/^EPA/, "EPA", "epa"], [/BOR$|-BOR/, "Reclamation", "usbr"], [/NPS/, "NPS", ""], [/FWS/, "FWS", "fws"], [/^DOD/, "Defense", ""], [/^DOC/, "Commerce", ""]];
const agencyOf = (f) => { const a = AGENCIES.find(([rx]) => rx.test(f.agencyCode || "")); return a ? { short: a[1], logo: a[2] } : { short: "Other", logo: "" }; };
const F_TYPES = ["Grant", "Fellowship", "Scholarship", "Prize & challenge", "Training & REU", "Cooperative agreement"];
const F_STAGES = ["Students", "Postdocs", "Early career", "Researchers & institutions"];
const daysTo = (iso) => Math.round((utc(iso) - utc(todayISO())) / DAY);
const fundOk = (f, skip) => (skip === "type" || S.ftype === "All" || f.type === S.ftype) && (skip === "stage" || S.fstage === "All" || f.stage === S.fstage)
  && (skip === "agency" || S.fagency === "All" || agencyOf(f).short === S.fagency) && (skip === "theme" || !S.theme || inTheme(f, S.theme))
  && (!S.fq || `${f.title} ${f.agency} ${f.summary} ${f.number}`.toLowerCase().includes(S.fq.toLowerCase()));
const money = (v) => (+v > 1 ? `Up to $${Number(v).toLocaleString("en-US")}` : "");
function fundRow(f) {
  const a = agencyOf(f), d = f.deadline ? daysTo(f.deadline) : null;
  const due = f.rolling ? '<span class="soon">Open any time</span>' : d <= 14 ? `<span class="due hot">${d <= 0 ? "Due today" : d === 1 ? "Due tomorrow" : `Due in ${d} days`}</span>` : `<span class="soon">in ${d < 60 ? `${d} days` : `${Math.round(d / 30.4)} months`}</span>`;
  return `<article class="meet fund">${logo({ logo: a.logo, short: a.short })}
    <div class="mbody"><div class="mtop"><h3><a href="${esc(safeUrl(f.link))}" target="_blank" rel="noopener">${esc(f.title)}</a></h3>${due}</div>
      <div class="who">${esc(f.agency)}${f.number ? ` · ${esc(f.number)}` : ""}</div>
      <div class="meta"><span class="mi">${ic("cal", 14)}${f.deadline ? `Deadline ${esc(fmt(f.deadline, { day: "numeric", month: "short", year: "numeric" }))}` : "No fixed deadline"}</span>${money(f.ceiling) ? `<span class="mi">${ic("coin", 14)}${money(f.ceiling)}</span>` : ""}<span class="pill soft">${esc(f.type)}</span><span class="pill soft">${esc(f.stage)}</span>${f.status === "forecasted" ? '<span class="pill warn" title="Announced ahead of time; details may change">Forecast</span>' : ""}</div>
      ${f.summary ? `<p class="fsum">${esc(f.summary)}</p>` : ""}
      <div class="mfoot"><div class="fdots">${famDots(familiesOf(f))}</div><div class="mlinks"><a href="${esc(safeUrl(f.link))}" target="_blank" rel="noopener">${ic("ext", 14)}Details on Grants.gov</a>${f.deadline ? `<button data-fics="${esc(f.id)}">${ic("cal", 14)}Add deadline to calendar</button>` : ""}</div></div>
    </div></article>`;
}
function viewFunding() {
  const all = FUND.items || [];
  let list = all.filter((f) => fundOk(f));
  const count = (skip, test) => all.filter((f) => fundOk(f, skip) && test(f)).length;
  const types = F_TYPES.filter((t) => all.some((f) => f.type === t));
  const agencies = [...new Set(all.map((f) => agencyOf(f).short))].sort((x, y) => count("agency", (f) => agencyOf(f).short === y) - count("agency", (f) => agencyOf(f).short === x));
  const opt = (key, value, label, n) => `<button class="opt" data-${key}="${esc(value)}" aria-pressed="${S[key] === value}"><span>${esc(label)}</span><span class="n">${n}</span></button>`;
  let body;
  if (S.fsort === "new") {
    list = list.sort((x, y) => (y.firstSeen || "").localeCompare(x.firstSeen || ""));
    body = list.map(fundRow).join("");
  } else {
    const soon = list.filter((f) => !f.rolling && daysTo(f.deadline) <= 30), later = list.filter((f) => !f.rolling && daysTo(f.deadline) > 30), open = list.filter((f) => f.rolling);
    body = [["Closing in the next 30 days", soon], ["Later deadlines", later], ["Open any time", open]].filter(([, l]) => l.length)
      .map(([h, l]) => `<section class="month"><h3>${h}</h3>${l.map(fundRow).join("")}</section>`).join("");
  }
  const awards = NEWS.items.filter((i) => i.category === "awards").slice(0, 6);
  return `<div class="layout"><aside class="filters" aria-label="Funding filters">
      <div><h4>Type</h4>${opt("ftype", "All", "All types", count("type", () => true))}${types.map((t) => opt("ftype", t, t, count("type", (f) => f.type === t))).join("")}</div>
      <div><h4>Who it's for</h4>${opt("fstage", "All", "Everyone", count("stage", () => true))}${F_STAGES.map((t) => opt("fstage", t, t, count("stage", (f) => f.stage === t))).join("")}</div>
      <div><h4>Field</h4><button class="opt" data-theme="" aria-pressed="${!S.theme}"><span>All fields</span></button>${FAMILIES.map((fm) => `<button class="opt" data-theme="fam:${fm.id}" aria-pressed="${S.theme === `fam:${fm.id}`}"><span><i style="background:${fm.color}"></i>${esc(fm.label)}</span><span class="n">${count("theme", (f) => familiesOf(f).includes(fm.id))}</span></button>`).join("")}</div>
      <div><h4>Agency</h4>${opt("fagency", "All", "All agencies", count("agency", () => true))}${agencies.map((t) => opt("fagency", t, t, count("agency", (f) => agencyOf(f).short === t))).join("")}</div>
      <div><h4>Sort</h4>${opt("fsort", "deadline", "Deadline first", "")}${opt("fsort", "new", "Newest first", "")}</div>
    </aside><div>
    <div class="toolbar"><label class="search"><input id="fq" type="search" placeholder="Search funding: hydrology, Mars, postdoc, NSF…" value="${esc(S.fq)}" aria-label="Search funding"></label><span class="count">${list.length} open</span></div>
    ${body || `<p class="empty">${all.length ? "Nothing matches. Try another type, stage, field or agency." : "Funding opportunities appear here after the next update."}</p>`}
    ${awards.length ? `<section class="month"><h3>Awards &amp; prizes in the news</h3><div class="list">${awards.map(row).join("")}</div></section>` : ""}
    <p class="note">U.S. federal opportunities from Grants.gov (NSF, NASA, NOAA, USGS, DOE, EPA and others), refreshed twice a day. Always check eligibility and the deadline on the official page before applying.</p>
    </div></div>`;
}

/* ---------- community ---------- */
const FORUM = "https://github.com/eplas-science/eplas-science.github.io/discussions";
const ROOMS = [...FAMILIES.map((f) => ({ label: f.label, color: f.color, about: f.blurb, icon: f.id })),
  { label: "Careers & jobs", color: "#0f766e", about: "Job hunting, grad school, skills and career advice", icon: "briefcase" },
  { label: "Conferences", color: "#db2777", about: "Meetings, abstracts, travel and meet-ups", icon: "cal" }];
const CAT_ICON = { "q-a": "help", "show-and-tell": "spark", general: "chat", ideas: "bulb", polls: "poll", announcements: "mega" };
const STARTS = [
  { slug: "q-a", icon: "help", name: "Ask a question", about: "Methods, software, field problems, papers you can't make sense of. Mark the reply that answered it." },
  { slug: "show-and-tell", icon: "spark", name: "Share your work", about: "A paper, map, dataset, field photo, code or thesis. Tell people what you found." },
  { slug: "general", icon: "chat", name: "Start a conversation", about: "Anything Earth and planetary: news you want to discuss, collaborators you're looking for, a hello." },
  { slug: "ideas", icon: "bulb", name: "Suggest an idea", about: "Sources, branches or features you'd like to see on EPLAS." },
  { slug: "polls", icon: "poll", name: "Run a poll", about: "Ask the community to vote: favourite field software, conference plans, anything." },
];
function newThread(slug, extra = {}) {
  const q = new URLSearchParams({ category: slug, ...extra });
  return `${FORUM}/new?${q}`;
}
const roomUrl = (label) => `${FORUM}?${new URLSearchParams({ discussions_q: `label:"${label}"` })}`;
function threadRow(t) {
  const labels = t.labels.map((l) => ROOMS.find((r) => r.label === l)).filter(Boolean);
  return `<a class="thread" href="${esc(safeUrl(t.url))}" target="_blank" rel="noopener">
    ${t.avatar ? `<img src="${esc(safeUrl(t.avatar))}" alt="" width="36" height="36" loading="lazy">` : '<span class="av"></span>'}
    <div><b>${esc(t.title)}</b>${t.excerpt ? `<p>${esc(t.excerpt)}</p>` : ""}
      <div class="tmeta"><span class="tcat">${ic(CAT_ICON[t.categorySlug] || "chat", 13)}${esc(t.category)}</span>${labels.map((r) => `<span class="tlab" style="--c:${r.color}">${esc(r.label)}</span>`).join("")}<span>${esc(t.author)} · ${ago(t.updated)}</span>${t.answered ? '<span class="pill live">Answered</span>' : ""}</div></div>
    <div class="tcount"><b>${t.replies}</b><small>${t.replies === 1 ? "reply" : "replies"}</small>${t.votes ? `<small>▲ ${t.votes}</small>` : ""}</div></a>`;
}
function viewCommunity() {
  const items = COMM.items || [];
  const shown = items.filter((t) => !S.cfield || t.labels.includes(S.cfield));
  return `<div class="comm">
    <div class="comm-hero"><div><small>The EPLAS community</small><h2>Talk Earth and planetary science with people who do it</h2>
      <p>Ask questions, share your work, find collaborators and swap career advice with students, researchers and professionals in every branch, from groundwater to Mars.</p>
      <div class="mact"><a class="btn primary" href="${esc(newThread("general"))}" target="_blank" rel="noopener">Start a discussion</a><a class="btn" href="${FORUM}" target="_blank" rel="noopener">Browse the forum</a></div>
      <p class="fine">The forum runs on GitHub Discussions. Reading is open to everyone; posting needs a free GitHub account.</p></div></div>
    <section><div class="sec-head"><h2>Start in the right place</h2></div><div class="starts">${STARTS.map((c) => `<a class="start" href="${esc(newThread(c.slug))}" target="_blank" rel="noopener"><span class="sico">${ic(c.icon, 20)}</span><b>${esc(c.name)}</b><p>${esc(c.about)}</p></a>`).join("")}</div></section>
    <section><div class="sec-head"><h2>Rooms by field</h2><span class="hint">Every thread can carry field labels; each room lists the threads with its label</span></div><div class="rooms">${ROOMS.map((r) => { const n = items.filter((t) => t.labels.includes(r.label)).length; return `<a class="room" style="--c:${r.color}" href="${esc(roomUrl(r.label))}" target="_blank" rel="noopener"><span class="rico">${ic(r.icon, 17)}</span><span class="rt"><b>${esc(r.label)}</b><small>${esc(r.about)}</small></span><span class="rn">${n || "—"}</span></a>`; }).join("")}</div></section>
    <section><div class="sec-head"><h2>Latest threads</h2><span class="hint">${COMM.total ? `${COMM.total} in all · ` : ""}refreshed twice a day</span><a class="more" href="${FORUM}" target="_blank" rel="noopener">Open the forum</a></div>
      ${items.length ? `<div class="bchips"><button class="bchip" style="--c:#0f766e" data-cfield="" aria-pressed="${!S.cfield}">All fields</button>${ROOMS.filter((r) => items.some((t) => t.labels.includes(r.label))).map((r) => `<button class="bchip" style="--c:${r.color}" data-cfield="${esc(r.label)}" aria-pressed="${S.cfield === r.label}">${esc(r.label)}</button>`).join("")}</div>` : ""}
      ${shown.length ? `<div class="threads">${shown.map(threadRow).join("")}</div>` : `<div class="comm-empty"><b>${items.length ? "No threads in this field yet." : "The forum has just opened."}</b><p>Be the first: <a href="${esc(newThread("q-a"))}" target="_blank" rel="noopener">ask a question</a>, <a href="${esc(newThread("show-and-tell"))}" target="_blank" rel="noopener">share your work</a> or <a href="${esc(newThread("general", { title: "Hello from …", body: "Who I am, what I work on, and what I'd like to talk about:" }))}" target="_blank" rel="noopener">introduce yourself</a>.</p></div>`}
    </section>
    <section class="rules"><h3>House rules</h3><ul><li>Be kind and assume good faith. People here range from first-year students to emeritus professors.</li><li>Cite your sources and link the paper or data when you can.</li><li>Job posts are welcome in Careers &amp; jobs; adverts and self-promotion elsewhere are not.</li><li>No personal data about others, and nothing you wouldn't say at a conference poster.</li></ul></section>
  </div>`;
}

/* ---------- choose themes ---------- */
function editThemes() {
  const back = document.createElement("div"); back.className = "modal-back";
  const box = document.createElement("div"); box.className = "panel modal"; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Choose your branches");
  box.innerHTML = `<h3>Your branches</h3><p class="sub">Today shows the fields of the branches you pick, and “Only my branches” filters to them. Saved in this browser only.</p>
    <div class="modal-scroll">${FAMILIES.map((f) => `<h4 style="color:${f.color}">${esc(f.label)}</h4>${THEMES.filter((t) => t.family === f.id).map((t) => `<label><input type="checkbox" value="${t.id}" ${S.mineThemes.has(t.id) ? "checked" : ""}><i class="theme-dot" style="background:${t.color}"></i>${esc(t.label)}</label>`).join("")}`).join("")}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-m="save">Save</button></div>`;
  document.body.append(back, box);
  const close = () => { back.remove(); box.remove(); };
  back.addEventListener("click", close);
  box.addEventListener("click", (e) => {
    const b = e.target.closest("[data-m]"); if (!b) return;
    if (b.dataset.m === "save") { S.mineThemes = new Set([...box.querySelectorAll("input:checked")].map((x) => x.value)); store.set("branches", [...S.mineThemes]); }
    close(); render();
  });
}

/* ---------- render + routing ---------- */
const route = () => (["today", "branches", "news", "papers", "jobs", "funding", "conferences", "community"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "today");
function render() {
  const r = route(), view = $("#view");
  const keep = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.getAttribute("href") === `#${r}` ? "page" : "false"));
  view.innerHTML = !NEWS.items.length && !["jobs", "funding", "conferences", "community"].includes(r) ? '<p class="empty">No stories collected yet.</p>' : r === "news" ? viewList("News") : r === "papers" ? viewList("Paper") : r === "jobs" ? viewJobs() : r === "conferences" ? viewConferences() : r === "community" ? viewCommunity() : r === "funding" ? viewFunding() : r === "branches" ? viewBranches() : viewToday();
  paint(view);
  if (keep && document.getElementById(keep)) { const el = document.getElementById(keep); el.focus(); if (pos != null && el.setSelectionRange) el.setSelectionRange(pos, pos); }
}
function ticker() {
  const top = NEWS.items.filter((i) => i.kind === "News").slice(0, 26);
  const one = top.map((i) => `<a href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener"><i style="background:${color(i.category)}"></i><span class="t">${esc(i.title)}</span><em>${esc(i.source)}</em></a>`).join("");
  const t = $("#ticker"); t.innerHTML = one + one; t.style.setProperty("--dur", `${Math.max(80, top.length * 8)}s`);
}
function footer() {
  const ok = (NEWS.sources || []).filter((s) => s.ok).length;
  $("#foot").innerHTML = `<div>An informal, automatically updated digest of news, research papers and jobs from public feeds and job boards. Summaries are the publishers' own. Not affiliated with any university.</div>`
    + `<div>Updated ${NEWS.updated ? new Date(NEWS.updated).toLocaleString(undefined, { weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit" }) : "—"} from ${ok} public news feeds and ${(JOBS.sources || []).filter((s) => s.ok).length} job boards, twice a day. Summaries are the opening lines of each source's own article; follow the link for the full story. Pictures belong to their publishers; where a story has none, a card shows its field and source.</div>`
    + `<details><summary>Sources</summary><ul>${[...(NEWS.sources || []), ...(JOBS.sources || [])].map((s) => `<li>${esc(s.source)} ${s.ok ? `· ${s.count}` : "· unavailable"}</li>`).join("")}</ul></details>`;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a"); if (!t) return;
  const d = t.dataset;
  if (d.cat !== undefined && t.classList.contains("opt")) { S.cat = d.cat || null; render(); }
  else if (d.theme !== undefined) { S.theme = d.theme || null; S.cat = null; if (t.classList.contains("rt") || d.go) location.hash = `#${d.go || "news"}`; else render(); if (location.hash === `#${d.go || "news"}`) render(); }
  else if (d.days) { S.days = +d.days; render(); }
  else if (d.mine !== undefined) { S.mine = !S.mine; render(); }
  else if (d.trend) { S.q = d.trend; S.theme = null; location.hash = "#news"; }
  else if (d.gotoTheme) { S.theme = d.gotoTheme; S.cat = null; }
  else if (d.editThemes !== undefined) editThemes();
  else if (d.cfield !== undefined) { S.cfield = d.cfield || null; render(); }
  else if (d.ftype) { S.ftype = d.ftype; render(); }
  else if (d.fstage) { S.fstage = d.fstage; render(); }
  else if (d.fagency) { S.fagency = d.fagency; render(); }
  else if (d.fsort) { S.fsort = d.fsort; render(); }
  else if (d.fics) { const f = FUND.items.find((x) => String(x.id) === d.fics); if (f) saveIcs([{ id: `grant-${f.id}`, name: `Deadline: ${f.title}`, org: f.agency, url: f.link, start: f.deadline, end: f.deadline }], `deadline-${f.id}.ics`); }
  else if (d.mfield !== undefined) { S.mfield = d.mfield || null; render(); }
  else if (d.mregion) { S.mregion = d.mregion; render(); }
  else if (d.ics) { const m = MEET.items.find((x) => x.id === d.ics); if (m) saveIcs([m], `${m.id}.ics`); }
  else if (d.icsAll !== undefined) { saveIcs(upcoming().filter((m) => meetOk(m)), "earth-science-conferences.ics"); }
  else if (d.newsCat) { S.cat = d.newsCat; S.theme = null; S.q = ""; location.hash = "#news"; }
  else if (d.jlevel) { S.jlevel = d.jlevel; render(); }
  else if (d.jsector) { S.jsector = d.jsector; render(); }
  else if (d.jskill) { S.jskills.has(d.jskill) ? S.jskills.delete(d.jskill) : S.jskills.add(d.jskill); render(); }
  else if (d.jskillClear !== undefined) { S.jskills.clear(); render(); }
  else if (d.jsort) { S.jsort = d.jsort; render(); }
  else if (d.saved !== undefined) { S.savedOnly = !S.savedOnly; render(); }
  else if (d.save) { S.saved.has(d.save) ? S.saved.delete(d.save) : S.saved.add(d.save); store.set("saved", [...S.saved]); render(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.q = e.target.value; clearTimeout(S.t); S.t = setTimeout(render, 160); }
  if (e.target.id === "jq") { S.jq = e.target.value; clearTimeout(S.t); S.t = setTimeout(render, 160); }
  if (e.target.id === "fq") { S.fq = e.target.value; clearTimeout(S.t); S.t = setTimeout(render, 160); }
});
window.addEventListener("hashchange", () => { render(); window.scrollTo({ top: 0 }); });

async function boot() {
  NEWS = embedded("news-data") || await fetch("news.json").then((r) => r.json()).catch(() => NEWS);
  JOBS = embedded("jobs-data") || await fetch("jobs.json").then((r) => r.json()).catch(() => JOBS);
  MEET = await fetch("conferences.json").then((r) => (r.ok ? r.json() : MEET)).catch(() => MEET);
  COMM = await fetch("community.json").then((r) => (r.ok ? r.json() : COMM)).catch(() => COMM);
  FUND = await fetch("funding.json").then((r) => (r.ok ? r.json() : FUND)).catch(() => FUND);
  CAT = Object.fromEntries((NEWS.categories || []).map((c) => [c.id, c]));
  ticker(); footer(); render();
}
boot();
})();
</script>
